[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envparity"
version = "0.1.0"
description = "Compare .env files without printing configuration values"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SonyDev"}]
dependencies = []

[project.scripts]
envparity = "envparity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
